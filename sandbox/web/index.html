<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sandbox</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div>
      <h1>sandbox</h1>
      <p class="sub" id="phaseLabel">loading…</p>
    </div>
    <div class="toolbar">
      <button id="execute">Execute <kbd>Space</kbd></button>
      <button id="endTurn">End / Ready <kbd>E</kbd></button>
      <button id="autoStep">AI step</button>
      <button id="skipContact" title="Dev: jump straight into initiative">Skip contact</button>
      <button id="fogToggle" class="mode-btn" title="Player view follows the current actor.">Dev view</button>
    </div>
  </header>
  <main>
    <aside class="subject-col">
      <h2>Subject</h2>
      <div id="inspect"><p class="empty">Nothing selected</p></div>
    </aside>
    <div class="center">
      <div class="stage">
        <canvas id="map" width="880" height="520"></canvas>
        <div id="hoverHud" class="hover-hud hidden"></div>
        <div id="prompt" class="prompt hidden"></div>
      </div>
      <section class="timeline-wrap">
        <h2>Turn tape <span id="clockLabel"></span></h2>
        <div id="timeline"></div>
        <div class="queue-row">
          <ol id="queueList"></ol>
          <button id="clearQueue">Clear</button>
        </div>
      </section>
      <section class="roster-wrap">
        <h2>Turn order</h2>
        <div id="roster"></div>
      </section>
    </div>
    <aside class="orders-col">
      <section>
        <h2>Orders</h2>
        <div class="toggle-row">
          <span class="toggle-label">Gait</span>
          <div class="icon-toggle" id="gait" data-value="walk">
            <button type="button" data-val="walk" class="on" title="Walk">Walk</button>
            <button type="button" data-val="run" title="Run">Run</button>
            <button type="button" data-val="sprint" title="Sprint">Sprint</button>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Fire</span>
          <div class="icon-toggle" id="fire" data-value="snap">
            <button type="button" data-val="snap" class="on" title="One round">Snap</button>
            <button type="button" data-val="precise" title="Same time, tighter cone">Precise</button>
            <button type="button" data-val="burst" title="Three rounds">Burst</button>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Aim</span>
          <div class="icon-toggle" id="aim" data-value="torso">
            <button type="button" data-val="head" title="Head">Head</button>
            <button type="button" data-val="torso" class="on" title="Torso and abdomen">Torso</button>
            <button type="button" data-val="legs" title="Both legs">Legs</button>
          </div>
        </div>
        <div class="btns" id="actionBtns"></div>
        <p class="note">Click queues the next action after the last one. Ctrl-click drops it on free channels. Esc clears the queue. Shift-click a unit to inspect.</p>
      </section>
      <section>
        <h2>Current unit</h2>
        <div id="turnInfo" class="panel"></div>
      </section>
      <section class="events-wrap">
        <h2>Events</h2>
        <ol id="events"></ol>
      </section>
    </aside>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
