<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebGL2 check</title>
  <style>
    body { font: 14px/1.45 ui-monospace, monospace; background: #12151a; color: #e8edf4; padding: 20px; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Renderer check</h1>
  <pre id="out">running…</pre>
  <script type="module">
    const lines = [];
    const out = document.getElementById("out");
    const log = (s) => { lines.push(s); out.textContent = lines.join("\n"); };
    log(`ua: ${navigator.userAgent}`);
    log(`electron: ${/Electron|Cursor\//i.test(navigator.userAgent) ? "yes" : "no"}`);
    const probe = document.createElement("canvas");
    const gl = probe.getContext("webgl2");
    log(`webgl2: ${gl ? "yes" : "null"}`);
    if (gl) log(`renderer: ${gl.getParameter(gl.RENDERER)}`);
    try {
      const { initRenderer, initError, resizeCanvas, drawFrame } = await import("./gpu/renderer.js");
      const ok = await initRenderer();
      log(`initRenderer: ${ok}`);
      if (!ok) log(`initError: ${initError() || "?"}`);
      else {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        document.body.appendChild(canvas);
        resizeCanvas(canvas, 64, 64);
        const drawn = drawFrame(canvas, {
          cam: { target: { x: 4, y: 4, z: 0 }, yaw: 0.7, pitch: 0.55, dist: 12 },
          map: { min: [0, 0], max: [8, 8], ground: "dirt", surfaces: [] },
          solids: [{
            corners: [
              { x: 3, y: 3, z: 0 }, { x: 3, y: 3, z: 1.2 },
              { x: 3, y: 5, z: 0 }, { x: 3, y: 5, z: 1.2 },
              { x: 5, y: 3, z: 0 }, { x: 5, y: 3, z: 1.2 },
              { x: 5, y: 5, z: 0 }, { x: 5, y: 5, z: 1.2 },
            ],
            color: "#6a7b66",
            mat: "concrete",
          }],
          marks: {
            grid: false,
            shadows: [{
              min: { x: 3.7, y: 3.5 }, max: { x: 4.3, y: 4.0 },
              z0: 3.12, z1: 3.48, emit: 1, color: "#e8c86a",
            }],
            paths: [], rings: [], lines: [], rects: [], labels: [], edges: [],
          },
        });
        log(`drawFrame: ${drawn}`);
        log("OK: WebGL2 renderer init + first present");
      }
      window.__gpuCheck = { ok, reason: initError() || "" };
    } catch (err) {
      log(`FAIL: ${err && err.message ? err.message : err}`);
      window.__gpuCheck = { ok: false, reason: String(err && err.message ? err.message : err) };
    }
    document.title = window.__gpuCheck?.ok ? "WebGL2 OK" : "WebGL2 FAIL";
  </script>
</body>
</html>
