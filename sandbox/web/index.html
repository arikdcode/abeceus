<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sandbox</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div>
      <h1>sandbox</h1>
      <p class="sub" id="phaseLabel">loading…</p>
    </div>
    <div class="toolbar">
      <button id="execute">Execute <kbd>Space</kbd></button>
      <button id="endTurn">End / Ready <kbd>Enter</kbd></button>
      <button id="autoStep">AI step</button>
      <label class="scenario-pick">Scenario
        <select id="scenarioSelect" title="Reload this scenario from scratch"></select>
      </label>
      <button id="skipContact" title="Dev: jump straight into initiative">Skip contact</button>
      <div class="mode-pair" id="fogPair" data-value="dev" title="Player follows the current actor.">
        <button type="button" data-val="dev" class="on">Dev</button>
        <button type="button" data-val="player">Player</button>
      </div>
      <div class="mode-pair" id="camPair" data-value="overview" title="Strategy is the tactical angle. Overview is a wide cinematic 3/4. FPV is the acting unit. V cycles.">
        <button type="button" data-val="strategy">Strategy</button>
        <button type="button" data-val="overview" class="on">Overview</button>
        <button type="button" data-val="fpv">FPV</button>
      </div>
      <div class="mode-pair" id="roofPair" data-value="hide" title="Roofs stay in the map. Hidden by default so you can see people in rooms.">
        <button type="button" data-val="hide" class="on">No roofs</button>
        <button type="button" data-val="show">Roofs</button>
      </div>
      <div class="mode-pair" id="gridPair" data-value="show" title="Meter grid overlay. Turn it off for a cleaner screenshot.">
        <button type="button" data-val="show" class="on">Grid</button>
        <button type="button" data-val="hide">No grid</button>
      </div>
      <div class="mode-pair" id="sunPair" data-value="on" title="Turn the sun off to inspect lamp lighting only.">
        <button type="button" data-val="on" class="on">Sun</button>
        <button type="button" data-val="off">No sun</button>
      </div>
    </div>
  </header>
  <main>
    <aside class="subject-col">
      <h2>Subject</h2>
      <div id="inspect"><p class="empty">Nothing selected</p></div>
    </aside>
    <div class="center">
      <div class="stage">
        <div class="viewport">
          <canvas id="view" width="880" height="520"></canvas>
        </div>
        <div id="hoverHud" class="hover-hud hidden"></div>
        <div id="prompt" class="prompt hidden"></div>
      </div>
      <section class="timeline-wrap">
        <h2>Turn tape <span id="clockLabel"></span> <button id="clearQueue" type="button">Clear</button></h2>
        <div id="timeline"></div>
      </section>
      <section class="roster-wrap">
        <h2>Turn order</h2>
        <div id="roster"></div>
      </section>
    </div>
    <aside class="orders-col">
      <div class="orders-main">
      <section>
        <h2>Orders</h2>
        <div class="toggle-row">
          <span class="toggle-label">Gait</span>
          <div class="icon-toggle" id="gait" data-value="sprint">
            <button type="button" data-val="walk" title="Walk">Walk</button>
            <button type="button" data-val="run" title="Run">Run</button>
            <button type="button" data-val="sprint" class="on" title="Sprint">Sprint</button>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Fire</span>
          <div class="icon-toggle" id="fire" data-value="snap">
            <button type="button" data-val="snap" class="on" title="One round">Snap</button>
            <button type="button" data-val="precise" title="Same time, tighter cone">Precise</button>
            <button type="button" data-val="burst" title="Three rounds">Burst</button>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Aim</span>
          <div class="icon-toggle" id="aim" data-value="torso">
            <button type="button" data-val="head" title="Head">Head</button>
            <button type="button" data-val="torso" class="on" title="Torso and abdomen">Torso</button>
            <button type="button" data-val="legs" title="Both legs">Legs</button>
          </div>
        </div>
        <div id="actionBtns"></div>
      </section>
      <section>
        <h2>Acting</h2>
        <div id="turnInfo"></div>
      </section>
    </div>
    <section class="events-wrap">
      <h2>Events</h2>
      <ol id="events"></ol>
    </section>
    </aside>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
